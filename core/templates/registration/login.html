<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Acessar — Nice Restaurante</title>
  <style>
    :root { color-scheme: dark; --bg:#0c0a07; --card:#17120a; --gold:#c8873a; --text:#ede0c4; --muted:#bdb19c; --error:#ffaaa6; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px; background:radial-gradient(circle at top, #2a1b0c, var(--bg) 48%); color:var(--text); font:16px system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(100%, 390px); padding:30px; background:var(--card); border:1px solid #61421f; border-radius:16px; box-shadow:0 16px 50px #0008; }
    h1 { margin:0 0 6px; font:600 2rem Georgia,serif; color:var(--gold); } p { margin:0 0 24px; color:var(--muted); }
    label { display:block; margin:16px 0 7px; font-size:.85rem; font-weight:700; } input { width:100%; min-height:46px; padding:10px 12px; border:1px solid #765126; border-radius:8px; background:#0c0a07; color:var(--text); font:inherit; } input:focus { outline:3px solid #c8873a55; border-color:var(--gold); }
    button { width:100%; min-height:46px; margin-top:24px; border:0; border-radius:8px; background:var(--gold); color:#fff; font:700 1rem system-ui,sans-serif; cursor:pointer; } .errorlist { margin:12px 0; padding-left:18px; color:var(--error); font-size:.9rem; }
    @media (max-width:420px) { main { padding:24px 20px; border-radius:12px; } }
  </style>
</head>
<body><main>
  <h1>Nice</h1><p>Acesse o sistema do restaurante.</p>
  <form method="post" novalidate>{% csrf_token %}
    {% if form.non_field_errors %}{{ form.non_field_errors }}{% endif %}
    <label for="id_username">Usuário</label>{{ form.username }}
    {% if form.username.errors %}{{ form.username.errors }}{% endif %}
    <label for="id_password">Senha</label>{{ form.password }}
    {% if form.password.errors %}{{ form.password.errors }}{% endif %}
    <input type="hidden" name="next" value="{{ request.GET.next }}">
    <button type="submit">Entrar</button>
  </form>
</main></body>
</html>
