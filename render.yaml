services:
  - type: web
    name: nice-pasteis
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && waitress-serve --port=$PORT core.wsgi:application
    disk:
      name: nice-pasteis-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/db.sqlite3
      - key: DJANGO_SECRET_KEY
        generateValue: true
